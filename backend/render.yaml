services:
  - type: web
    name: duosync-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RIOT_API_KEY
        sync: false
      - key: CACHE_TTL
        value: 7200
      - key: MAX_MATCHES_TO_FETCH
        value: 300
